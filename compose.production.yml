services:
  template-filler:
    build:
      context: .
      dockerfile: Dockerfile
    image: template-filler:latest
    container_name: template-filler
    restart: unless-stopped
    ports:
      - "127.0.0.1:5082:8080"
    volumes:
      - ./data:/app/App_Data
    networks:
      - caddy-web

networks:
  caddy-web:
    external: true
    name: vk-friends-monitor_web
