name: Deploy TemplateFiller

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: template-filler-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARCHIVE_NAME: template-filler-${{ github.sha }}.tar.gz

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is empty"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is empty"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is empty"; exit 1; }

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          test -f TemplateFiller.csproj
          test -f Dockerfile
          test -f compose.production.yml
          node --check wwwroot/app.js

      - name: Pack release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ARCHIVE="$RUNNER_TEMP/$ARCHIVE_NAME"

          tar \
            --exclude='.git' \
            --exclude='./data' \
            --exclude='./App_Data/templates.json' \
            --exclude='./bin' \
            --exclude='./obj' \
            -czf "$RELEASE_ARCHIVE" \
            -C "$GITHUB_WORKSPACE" .

          test -s "$RELEASE_ARCHIVE"
          echo "RELEASE_ARCHIVE=$RELEASE_ARCHIVE" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp "$RELEASE_ARCHIVE" "$VPS_USER@$VPS_HOST:/tmp/$ARCHIVE_NAME"

      - name: Activate release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" \
            "ARCHIVE_PATH='/tmp/$ARCHIVE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/apps/template-filler"

          docker_cmd() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            elif sudo -n docker info >/dev/null 2>&1; then
              sudo -n docker "$@"
            else
              echo "User $(whoami) cannot run Docker." >&2
              return 1
            fi
          }

          compose_cmd() {
            if docker info >/dev/null 2>&1; then
              docker compose "$@"
            elif sudo -n docker info >/dev/null 2>&1; then
              sudo -n docker compose "$@"
            else
              echo "User $(whoami) cannot run Docker Compose." >&2
              return 1
            fi
          }

          mkdir -p "$APP_DIR/data"

          find "$APP_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name data \
            -exec rm -rf {} +

          tar -xzf "$ARCHIVE_PATH" -C "$APP_DIR"
          rm -f "$ARCHIVE_PATH"

          docker_cmd network inspect shared-proxy >/dev/null || {
            echo "Docker network shared-proxy does not exist. Run the reverse-proxy migration first." >&2
            exit 1
          }

          cd "$APP_DIR"
          compose_cmd -f compose.production.yml up -d --build
          docker_cmd image prune -f

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:5082/health >/dev/null; then
              echo "TemplateFiller container is healthy"
              break
            fi

            if test "$attempt" -eq 45; then
              compose_cmd -f compose.production.yml ps
              compose_cmd -f compose.production.yml logs --tail=200 template-filler
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              https://annushkaaaaa.store/templates/health >/dev/null; then
              echo "External health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "The container is healthy, but the public URL health check failed." >&2
          PROXY_CONTAINER="$(docker_cmd ps \
            --filter 'label=com.docker.compose.project=reverse-proxy' \
            --filter 'label=com.docker.compose.service=caddy' \
            --format '{{.Names}}' | head -n1)"
          test -z "$PROXY_CONTAINER" || docker_cmd logs --tail=200 "$PROXY_CONTAINER"
          exit 1
          REMOTE
